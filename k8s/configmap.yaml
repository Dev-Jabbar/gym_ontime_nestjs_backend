# Non-secret settings only. Anything secret (database URL, JWT secret, API
# keys) goes in the `gym-ontime-secrets` Secret instead, see k8s/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gym-ontime-config
  namespace: gym-ontime
  labels:
    app.kubernetes.io/name: gym-ontime-api
    app.kubernetes.io/part-of: gym-ontime
data:
  # development = login cookie works over plain http (port-forward).
  # For a real cluster behind https use NODE_ENV: "production" (then the
  # cookie is SameSite=None; Secure, and JWT_SECRET must be 32+ characters
  # and FRONTEND_URL must be set; the app refuses to start otherwise).
  NODE_ENV: "development"
  PORT: "3001"
  # Where Paystack sends people after paying: ${FRONTEND_URL}/payment-success
  FRONTEND_URL: "http://localhost:4000"
  # The in-cluster Redis Service from redis.yaml (cache = DB 0, queue = DB 1).
  REDIS_URL: "redis://redis:6379"
  # Number of proxies in front of the app. 0 = none (port-forward).
  # Use 1 behind an Ingress so the login rate limit sees real client IPs.
  TRUST_PROXY_HOPS: "0"
  # Interactive API docs at /api/docs. Set "false" to switch them off.
  SWAGGER_ENABLED: "true"
  # Optional: extra browser origins allowed to call the API. When set it
  # REPLACES the built-in list (localhost:3000/4000 + the Vercel site);
  # FRONTEND_URL is always allowed too.
  # CORS_ORIGINS: "http://localhost:4000,http://localhost:3000"
