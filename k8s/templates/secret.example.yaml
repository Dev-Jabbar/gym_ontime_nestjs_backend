# TEMPLATE ONLY. This repository is public: never put real values in this
# file and never commit a filled-in copy.
#
# Easiest way to create the real Secret (nothing touches git):
#   see "Create the Secret" in k8s/README.md
#
# If you prefer YAML: copy this file to k8s/secret.yaml (already in
# .gitignore), fill in the values, then `kubectl apply -f k8s/secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: gym-ontime-secrets
  namespace: gym-ontime
type: Opaque
stringData:
  # Required
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require"
  JWT_SECRET: "replace-with-a-random-string-of-48-or-more-characters"
  PAYSTACK_SECRET_KEY: "your-paystack-test-secret-key"
  # Optional (uploads)
  # CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  # CLOUDINARY_API_KEY: "your-api-key"
  # CLOUDINARY_API_SECRET: "your-api-secret"
  # Optional (push notifications; all three, key on ONE line with literal \n,
  # WITHOUT surrounding quotes)
  # FIREBASE_PROJECT_ID: "your-firebase-project-id"
  # FIREBASE_CLIENT_EMAIL: "your-service-account-email"
  # FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
  # Only for the optional migrate Job (Neon DIRECT, non-pooler, connection string)
  # DATABASE_URL_DIRECT: "postgresql://USER:PASSWORD@DIRECT-HOST/DBNAME?sslmode=require"
