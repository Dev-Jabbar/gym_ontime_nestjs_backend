# Continuous integration: on every push and pull request to master, prove the
# project installs, type-checks, builds, passes its tests and builds as a
# Docker image. Uses DUMMY values only: no real secrets are needed or used.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Reads the schema only; never connects to a database.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Build
        run: npm run build

      # The tests need no database, Redis, Paystack or Firebase.
      - name: Test
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gym-ontime-backend:ci .
